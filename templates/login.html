<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacroLens — Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(90deg, #00d4aa, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo p {
            color: rgba(255,255,255,0.4);
            font-size: 13px;
            margin-top: 6px;
        }

        .tabs {
            display: flex;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 28px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            color: rgba(255,255,255,0.4);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .tab.active {
            background: linear-gradient(90deg, #00d4aa, #7b2ff7);
            color: white;
        }

        .form { display: none; }
        .form.active { display: block; }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 46px 14px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
        }

        .input-wrapper input:focus {
            border-color: #00d4aa;
        }

        .eye-icon {
            position: absolute;
            right: 14px;
            cursor: pointer;
            opacity: 0.35;
            transition: opacity 0.2s;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eye-icon:hover { opacity: 0.85; }

        .eye-icon svg {
            width: 20px;
            height: 20px;
            stroke: white;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Regular inputs without eye icon */
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
        }

        .input-group input:focus {
            border-color: #00d4aa;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #00d4aa, #7b2ff7);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.3s;
        }

        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .message {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            min-height: 20px;
        }

        .message.success { color: #00d4aa; }
        .message.error { color: #ff6b6b; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">
        <h1>MacroLens</h1>
        <p>AI-powered nutrition tracking</p>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">Login</div>
        <div class="tab" onclick="switchTab('signup')">Sign Up</div>
    </div>

    <!-- LOGIN FORM -->
    <div class="form active" id="loginForm">
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="you@email.com">
        </div>
        <div class="input-group">
            <label>Password</label>
            <div class="input-wrapper">
                <input type="password" id="loginPassword" placeholder="••••••••">
                <span class="eye-icon" onclick="togglePassword('loginPassword', this)">
                    <svg viewBox="0 0 24 24" class="eye-open">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg viewBox="0 0 24 24" class="eye-closed" style="display:none">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </span>
            </div>
        </div>
        <button class="btn" onclick="login()">Login</button>
        <div class="message" id="loginMessage"></div>
    </div>

    <!-- SIGNUP FORM -->
    <div class="form" id="signupForm">
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="signupName" placeholder="Zahan Ahmed Khan">
        </div>
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="signupEmail" placeholder="you@email.com">
        </div>
        <div class="input-group">
            <label>Password</label>
            <div class="input-wrapper">
                <input type="password" id="signupPassword" placeholder="••••••••">
                <span class="eye-icon" onclick="togglePassword('signupPassword', this)">
                    <svg viewBox="0 0 24 24" class="eye-open">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg viewBox="0 0 24 24" class="eye-closed" style="display:none">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </span>
            </div>
        </div>
        <button class="btn" onclick="signup()">Create Account</button>
        <div class="message" id="signupMessage"></div>
    </div>
</div>

<script>
    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
        if (tab === 'login') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('loginForm').classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('signupForm').classList.add('active');
        }
    }

    function togglePassword(inputId, icon) {
        const input = document.getElementById(inputId);
        const eyeOpen = icon.querySelector('.eye-open');
        const eyeClosed = icon.querySelector('.eye-closed');
        if (input.type === 'password') {
            input.type = 'text';
            eyeOpen.style.display = 'none';
            eyeClosed.style.display = 'block';
            icon.style.opacity = '0.9';
        } else {
            input.type = 'password';
            eyeOpen.style.display = 'block';
            eyeClosed.style.display = 'none';
            icon.style.opacity = '0.35';
        }
    }

    async function login() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const message = document.getElementById('loginMessage');
        const btn = event.target;

        if (!email || !password) {
            showMessage(message, 'Please fill in all fields', 'error');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Logging in...';

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await response.json();
            if (data.success) {
                showMessage(message, 'Welcome back! Redirecting...', 'success');
                setTimeout(() => window.location.href = '/dashboard', 1000);
            } else {
                showMessage(message, data.message || 'Login failed', 'error');
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        } catch (err) {
            showMessage(message, 'Connection error. Try again.', 'error');
            btn.disabled = false;
            btn.textContent = 'Login';
        }
    }

    async function signup() {
        const name = document.getElementById('signupName').value;
        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;
        const message = document.getElementById('signupMessage');
        const btn = event.target;

        if (!name || !email || !password) {
            showMessage(message, 'Please fill in all fields', 'error');
            return;
        }

        if (password.length < 6) {
            showMessage(message, 'Password must be at least 6 characters', 'error');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Creating account...';

        try {
            const response = await fetch('/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            const data = await response.json();
            if (data.success) {
                showMessage(message, 'Account created! Please login.', 'success');
                setTimeout(() => switchTab('login'), 1500);
            } else {
                showMessage(message, data.message || 'Signup failed', 'error');
            }
        } catch (err) {
            showMessage(message, 'Connection error. Try again.', 'error');
        }

        btn.disabled = false;
        btn.textContent = 'Create Account';
    }

    function showMessage(element, text, type) {
        element.textContent = text;
        element.className = 'message ' + type;
    }

    document.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const activeForm = document.querySelector('.form.active').id;
            if (activeForm === 'loginForm') login();
            else signup();
        }
    });
</script>

</body>
</html>
