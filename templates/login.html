<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacroLens — Login</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body>

<div class="card">
    <div class="logo">
        <h1>MacroLens</h1>
        <p>AI-powered nutrition tracking</p>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">Login</div>
        <div class="tab" onclick="switchTab('signup')">Sign Up</div>
    </div>

    <!-- LOGIN FORM -->
    <div class="form active" id="loginForm">
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="you@email.com">
        </div>
        <div class="input-group">
            <label>Password</label>
            <div class="input-wrapper">
                <input type="password" id="loginPassword" placeholder="••••••••">
                <span class="eye-icon" onclick="togglePassword('loginPassword', this)">
                    <svg viewBox="0 0 24 24" class="eye-open">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg viewBox="0 0 24 24" class="eye-closed" style="display:none">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </span>
            </div>
        </div>
        <button class="btn" onclick="login()">Login</button>
        <div class="message" id="loginMessage"></div>
    </div>

    <!-- SIGNUP FORM -->
    <div class="form" id="signupForm">
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="signupName" placeholder="Zahan Ahmed Khan">
        </div>
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="signupEmail" placeholder="you@email.com">
        </div>
        <div class="input-group">
            <label>Password</label>
            <div class="input-wrapper">
                <input type="password" id="signupPassword" placeholder="••••••••">
                <span class="eye-icon" onclick="togglePassword('signupPassword', this)">
                    <svg viewBox="0 0 24 24" class="eye-open">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg viewBox="0 0 24 24" class="eye-closed" style="display:none">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </span>
            </div>
        </div>
        <button class="btn" onclick="signup()">Create Account</button>
        <div class="message" id="signupMessage"></div>
    </div>
</div>

<script src="/static/js/login.js"></script>
</body>
</html>
